<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Time 4U — Website Editor</title>
  </head>
  <body>
    <!-- Sveltia CMS: the sign-in-and-edit dashboard Clara uses. -->
    <script>
      // Clara signs in with an email code (Cloudflare Access), not GitHub: relabel the sign-in screen.
      new MutationObserver(function () {
        document.querySelectorAll("button").forEach(function (b) {
          var t = b.textContent;
          if (t.indexOf("Access Token") !== -1) b.hidden = true;
          else if (t.indexOf("Sign In with") !== -1 && t.indexOf("GitHub") !== -1) b.textContent = "Sign in to edit the website";
        });
      }).observe(document.documentElement, { childList: true, subtree: true });
    </script>
    <script src="https://unpkg.com/@sveltia/cms@0.258.1/dist/sveltia-cms.js"></script>
  </body>
</html>
