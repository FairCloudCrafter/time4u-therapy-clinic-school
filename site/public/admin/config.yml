# Decap CMS configuration — defines exactly what Clara can edit.
# Edits are saved as commits to GitHub, which auto-rebuilds the site on Cloudflare Pages.

backend:
  name: github
  repo: FairCloudCrafter/time4u-therapy-clinic-school
  branch: main
  base_url: https://cms-auth.time4utherapymassageclinicandschool.com

local_backend: true

media_folder: "site/public/images"
public_folder: "/images"

collections:
  - name: business
    label: "Business Info"
    description: "Contact details, hours, and Google reviews shown across the site."
    files:
      - name: details
        label: "Details & Reviews"
        file: "site/content/business.json"
        fields:
          - { name: name, label: "Full business name", widget: string }
          - { name: shortName, label: "Short name", widget: string }
          - { name: phone, label: "Phone number", widget: string, hint: "e.g. (405) 933-0962" }
          - { name: addressLine, label: "Street address", widget: string }
          - { name: city, label: "City", widget: string }
          - { name: state, label: "State", widget: string }
          - { name: zip, label: "ZIP code", widget: string }
          - { name: hours, label: "Hours", widget: string, hint: "e.g. Mon–Thu, 9am–5pm" }
          - { name: bookingNote, label: "Booking note", widget: string, hint: "e.g. By appointment only" }
          - { name: movingNotice, label: "Notice banner", widget: string, required: false, hint: "Short announcement, e.g. a move date. Leave blank to hide." }
          - name: hoursByDay
            label: "Hours by day (Contact page table)"
            label_singular: "Day"
            widget: list
            allow_add: false
            fields:
              - { name: day, label: "Day", widget: string }
              - { name: hours, label: "Hours", widget: string, required: false, hint: "e.g. 9:00 am – 5:00 pm. Leave blank if closed." }
          - { name: licenseNumber, label: "License number", widget: string }
          - { name: abmpMember, label: "ABMP member (show in footer)", widget: boolean, required: false }
          - { name: reviewsRating, label: "Google rating text", widget: string, hint: "e.g. 4.8 out of 5" }
          - { name: giftCertNote, label: "Gift certificate text (Contact page)", widget: text }
          - { name: facebook, label: "Facebook page link", widget: string, required: false, hint: "Full link starting with https://. Leave blank to hide." }
          - { name: instagram, label: "Instagram link", widget: string, required: false, hint: "Full link starting with https://. Leave blank to hide." }
          - name: studentPricing
            label: "Student massage pricing"
            label_singular: "Price"
            widget: list
            required: false
            hint: "Shown on the School page. Leave empty to hide the pricing section."
            fields:
              - { name: service, label: "Service", widget: string, hint: "e.g. Hour massage" }
              - { name: price, label: "Price", widget: string, hint: "e.g. $45.00" }
          - name: reviews
            label: "Reviews"
            label_singular: "Review"
            widget: list
            fields:
              - { name: quote, label: "Review text", widget: text }
              - { name: author, label: "Reviewer name", widget: string }
              - { name: source, label: "Source", widget: string, default: "Google review" }

  - name: homePage
    label: "Home Page"
    files:
      - name: home
        label: "Home page content"
        file: "site/content/site-home.json"
        description: "Fields are listed in the order they appear on the page, top to bottom."
        fields:
          - { name: eyebrow, label: "TOP — Small label above headline", widget: string }
          - { name: headline, label: "TOP — Big headline", widget: string }
          - { name: subheadline, label: "TOP — Text under headline", widget: text }
          - { name: ctaPrimary, label: "TOP — Call button text", widget: string }
          - { name: ctaSecondary, label: "TOP — Text-message button text", widget: string }
          - { name: ctaTertiary, label: "TOP — Services link text", widget: string }
          - { name: heroImage, label: "TOP — Photo", widget: image, hint: "A wide (landscape) photo works best." }
          - { name: heroImageAlt, label: "TOP — Photo description", widget: string, hint: "Describe the photo for screen readers, e.g. 'Clara giving a back massage'." }
          - name: trustBadges
            label: "TOP — Highlight boxes"
            label_singular: "Highlight"
            widget: list
            summary: "{{fields.value}} — {{fields.label}}"
            fields:
              - { name: value, label: "Big text", widget: string, hint: "e.g. 4.8 out of 5" }
              - { name: label, label: "Small text", widget: string, hint: "e.g. Google rating" }
          - { name: servicesHeading, label: "SERVICES — Heading", widget: string }
          - { name: servicesIntro, label: "SERVICES — Intro text", widget: text }
          - name: serviceCards
            label: "SERVICES — Service cards"
            label_singular: "Service card"
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: "Title", widget: string }
              - { name: image, label: "Photo", widget: image }
              - { name: alt, label: "Photo description", widget: string }
              - { name: body, label: "Text", widget: text }
          - { name: processHeading, label: "HOW IT WORKS — Heading", widget: string }
          - { name: processIntro, label: "HOW IT WORKS — Intro text", widget: text }
          - name: processSteps
            label: "HOW IT WORKS — Steps"
            label_singular: "Step"
            widget: list
            summary: "{{fields.number}}. {{fields.title}}"
            fields:
              - { name: number, label: "Step number", widget: string }
              - { name: title, label: "Title", widget: string }
              - { name: body, label: "Text", widget: text }
          - { name: reviewsHeading, label: "REVIEWS — Heading", widget: string, hint: "The reviews themselves are edited under Business Info." }
          - { name: giftHeading, label: "GIFT CERTIFICATES — Heading", widget: string }
          - { name: giftBody, label: "GIFT CERTIFICATES — Text", widget: text }
          - { name: giftNote, label: "GIFT CERTIFICATES — Small print", widget: string }
          - { name: giftCta, label: "GIFT CERTIFICATES — Button text", widget: string }
          - { name: contactHeading, label: "BOOKING — Heading", widget: string }
          - { name: contactBody, label: "BOOKING — Text", widget: text }
          - { name: trustedHeading, label: "LICENSED CARE — Heading", widget: string }
          - { name: trustedBody, label: "LICENSED CARE — Text", widget: text }
          - { name: trustedBadges, label: "LICENSED CARE — Tags", widget: list, field: { name: item, label: "Tag", widget: string } }
          - { name: credentialsLink, label: "LICENSED CARE — Credentials button text", widget: string }

  - name: servicesPage
    label: "Services Page"
    files:
      - name: services
        label: "Services page content"
        file: "site/content/site-services.json"
        fields:
          - { name: eyebrow, label: "Small label above headline", widget: string }
          - { name: headline, label: "Headline", widget: string }
          - { name: intro, label: "Intro text", widget: text }
          - { name: careHeading, label: "'What we help with' heading", widget: string }
          - { name: careBody, label: "'What we help with' text", widget: text }
          - { name: careBadges, label: "'What we help with' tags", widget: list, field: { name: item, label: "Tag", widget: string } }
          - { name: popularHeading, label: "'Most requested' heading", widget: string }
          - { name: popularItems, label: "'Most requested' list", widget: list, field: { name: item, label: "Service", widget: string } }
          - name: serviceGroups
            label: "Service groups & prices"
            label_singular: "Service group"
            widget: list
            fields:
              - { name: title, label: "Group title", widget: string }
              - { name: description, label: "Group description", widget: text, required: false }
              - name: items
                label: "Services & prices"
                label_singular: "Service"
                widget: list
                summary: "{{fields.name}} — {{fields.price}}"
                fields:
                  - { name: name, label: "Service", widget: string, hint: "e.g. Hour massage" }
                  - { name: price, label: "Price", widget: string, hint: "e.g. $75.00" }
              - { name: benefitSummary, label: "Benefits summary", widget: text, required: false }
              - { name: benefitAnchor, label: "Benefits page section id", widget: string, required: false, hint: "Links to that section on the Benefits page, e.g. massage or detox. Leave blank for no link." }
          - { name: pricingHeading, label: "Pricing box heading", widget: string }
          - { name: pricingBody, label: "Pricing box text", widget: text, hint: "The phone number is added automatically at the end." }
          - { name: pricingNote, label: "Pricing box small print", widget: text }
          - { name: ctaHeading, label: "Bottom heading", widget: string }
          - { name: ctaBody, label: "Bottom text", widget: text }
          - { name: ctaLink, label: "Bottom button text", widget: string }

  - name: aboutPage
    label: "About Page"
    files:
      - name: about
        label: "About page content"
        file: "site/content/site-about.json"
        fields:
          - { name: eyebrow, label: "Small label above headline", widget: string }
          - { name: headline, label: "Headline", widget: string }
          - { name: intro, label: "Intro text", widget: string }
          - { name: image, label: "Photo", widget: image, hint: "A photo of Clara works best here." }
          - { name: imageAlt, label: "Photo description", widget: string }
          - { name: paragraphs, label: "Story paragraphs", widget: list, field: { name: paragraph, label: "Paragraph", widget: text } }
          - { name: whyChooseHeading, label: "Side box heading", widget: string }
          - { name: whyChooseItems, label: "Side box list", widget: list, field: { name: item, label: "Item", widget: string } }
          - { name: specialtiesHeading, label: "Specialties heading", widget: string }
          - { name: specialtiesIntro, label: "Specialties intro text", widget: string }
          - { name: specialties, label: "Specialties", widget: list, field: { name: item, label: "Specialty", widget: string } }
          - { name: ctaHeading, label: "Bottom heading", widget: string }
          - { name: ctaBody, label: "Bottom text", widget: string }
          - { name: ctaButton, label: "Bottom button text", widget: string, hint: "The phone number is added automatically." }

  - name: contactPage
    label: "Contact Page"
    files:
      - name: contact
        label: "Contact page content"
        file: "site/content/site-contact.json"
        fields:
          - { name: eyebrow, label: "Small label above headline", widget: string }
          - { name: headline, label: "Headline", widget: string }
          - { name: intro, label: "Intro text", widget: text }
          - { name: bookHeading, label: "Booking box heading", widget: string, hint: "Phone, address and hours come from Business Info." }
          - { name: goodToKnowHeading, label: "'Good to know' heading", widget: string }
          - { name: goodToKnowItems, label: "'Good to know' list", widget: list, field: { name: item, label: "Item", widget: string } }
          - { name: faqLink, label: "FAQ button text", widget: string }

  - name: faqPage
    label: "FAQ Page"
    files:
      - name: faq
        label: "FAQ page content"
        file: "site/content/site-faq.json"
        fields:
          - { name: eyebrow, label: "Small label above headline", widget: string }
          - { name: headline, label: "Headline", widget: string }
          - { name: intro, label: "Intro text", widget: text }
          - name: faqs
            label: "Questions & answers"
            label_singular: "Question"
            widget: list
            summary: "{{fields.q}}"
            fields:
              - { name: q, label: "Question", widget: string }
              - { name: a, label: "Answer", widget: text }
          - { name: policiesHeading, label: "Policies heading", widget: string }
          - { name: policiesIntro, label: "Policies intro text", widget: text }
          - name: policies
            label: "Policies"
            label_singular: "Policy"
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: "Title", widget: string }
              - { name: body, label: "Text", widget: text }
          - { name: ctaHeading, label: "Bottom heading", widget: string }
          - { name: ctaBody, label: "Bottom text", widget: text }
          - { name: ctaLink, label: "Bottom button text", widget: string }

  - name: schoolPage
    label: "School Page"
    files:
      - name: school
        label: "School page content"
        file: "site/content/site-school.json"
        fields:
          - { name: eyebrow, label: "Small label above headline", widget: string }
          - { name: headline, label: "Headline", widget: string }
          - { name: intro, label: "Intro text", widget: text }
          - { name: cardHeading, label: "School box heading", widget: string }
          - { name: cardBody, label: "School box text", widget: text }
          - { name: cardBadges, label: "School box tags", widget: list, field: { name: item, label: "Tag", widget: string } }
          - { name: interestHeading, label: "Newsletter box heading", widget: string }
          - { name: interestBody, label: "Newsletter box text", widget: text }
          - { name: studentHeading, label: "Student massages heading", widget: string, hint: "Prices are edited under Business Info → Student massage pricing." }
          - { name: studentIntro, label: "Student massages text", widget: text }
          - { name: ctaPrimary, widget: hidden }
          - { name: ctaSecondary, label: "Student massages button text", widget: string }

  - name: benefitsPage
    label: "Benefits Page"
    files:
      - name: benefits
        label: "Benefits page content"
        file: "site/content/site-benefits.json"
        fields:
          - { name: eyebrow, label: "Small text above headline", widget: string }
          - { name: headline, label: "Headline", widget: string }
          - { name: intro, label: "Intro", widget: text }
          - name: firstVisit
            label: "Your first visit"
            widget: object
            fields:
              - { name: heading, label: "Heading", widget: string }
              - { name: body, label: "Text", widget: text }
              - { name: items, label: "Checklist", widget: list, field: { name: item, label: "Item", widget: string } }
          - name: services
            label: "Services"
            label_singular: "Service"
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: id, label: "Section id", widget: string, hint: "Lower case, no spaces (e.g. massage). The Services page links here." }
              - { name: name, label: "Service name", widget: string }
              - { name: tagline, label: "Tagline", widget: string }
              - { name: description, label: "Description", widget: text }
              - { name: benefits, label: "Benefits", widget: list, field: { name: item, label: "Benefit", widget: string } }
              - { name: prepTip, label: "Preparation tip", widget: text, required: false }
              - { name: disclaimer, label: "Disclaimer", widget: text, required: false }
          - { name: ctaHeading, label: "Bottom heading", widget: string }
          - { name: ctaBody, label: "Bottom text", widget: text }
          - { name: ctaLink, label: "Bottom button label", widget: string }

  - name: credentialsPage
    label: "Credentials Page"
    files:
      - name: credentials
        label: "Credentials page content"
        file: "site/content/site-credentials.json"
        fields:
          - { name: eyebrow, label: "Small text above headline", widget: string }
          - { name: headline, label: "Headline", widget: string }
          - { name: intro, label: "Intro", widget: text }
          - name: items
            label: "Credential cards"
            label_singular: "Credential"
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: "Title", widget: string }
              - { name: body, label: "Text", widget: text, hint: "Type {license} to insert the license number from Business Info." }
          - { name: note, label: "Small print", widget: text }
          - { name: ctaHeading, label: "Bottom heading", widget: string }
          - { name: ctaBody, label: "Bottom text", widget: string }
          - { name: ctaLink, label: "Bottom button label", widget: string }
