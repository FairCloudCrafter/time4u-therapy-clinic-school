# Decap CMS configuration — defines exactly what Clara can edit.
# Edits are saved as commits to GitHub, which auto-rebuilds the site on Cloudflare Pages.

backend:
  name: github
  repo: FairCloudCrafter/time4u-therapy-clinic-school
  branch: main
  base_url: https://cms-auth.time4utherapymassageclinicandschool.com

local_backend: true

media_folder: "site/public/images"
public_folder: "/images"

collections:
  - name: business
    label: "Business Info"
    description: "Contact details, hours, and Google reviews shown across the site."
    files:
      - name: details
        label: "Details & Reviews"
        file: "site/content/business.json"
        fields:
          - { name: name, label: "Full business name", widget: string }
          - { name: shortName, label: "Short name", widget: string }
          - { name: phone, label: "Phone number", widget: string, hint: "e.g. (405) 933-0962" }
          - { name: addressLine, label: "Street address", widget: string }
          - { name: city, label: "City", widget: string }
          - { name: state, label: "State", widget: string }
          - { name: zip, label: "ZIP code", widget: string }
          - { name: hours, label: "Hours", widget: string, hint: "e.g. Mon–Thu, 9am–5pm" }
          - { name: bookingNote, label: "Booking note", widget: string, hint: "e.g. By appointment only" }
          - { name: movingNotice, label: "Notice banner", widget: string, required: false, hint: "Short announcement, e.g. a move date. Leave blank to hide." }
          - name: hoursByDay
            label: "Hours by day (Contact page table)"
            label_singular: "Day"
            widget: list
            allow_add: false
            fields:
              - { name: day, label: "Day", widget: string }
              - { name: hours, label: "Hours", widget: string, required: false, hint: "e.g. 9:00 am – 5:00 pm. Leave blank if closed." }
          - { name: licenseNumber, label: "License number", widget: string }
          - { name: abmpMember, label: "ABMP member (show in footer)", widget: boolean, required: false }
          - { name: reviewsRating, label: "Google rating text", widget: string, hint: "e.g. 4.8 out of 5" }
          - { name: giftCertNote, label: "Gift certificate text (Contact page)", widget: text }
          - { name: facebook, label: "Facebook page link", widget: string, required: false, hint: "Full link starting with https://. Leave blank to hide." }
          - { name: instagram, label: "Instagram link", widget: string, required: false, hint: "Full link starting with https://. Leave blank to hide." }
          - name: studentPricing
            label: "Student massage pricing"
            label_singular: "Price"
            widget: list
            required: false
            hint: "Shown on the School page. Leave empty to hide the pricing section."
            fields:
              - { name: service, label: "Service", widget: string, hint: "e.g. Hour massage" }
              - { name: price, label: "Price", widget: string, hint: "e.g. $45.00" }
          - name: reviews
            label: "Reviews"
            label_singular: "Review"
            widget: list
            fields:
              - { name: quote, label: "Review text", widget: text }
              - { name: author, label: "Reviewer name", widget: string }
              - { name: source, label: "Source", widget: string, default: "Google review" }

  - name: homePage
    label: "Home Page"
    files:
      - name: home
        label: "Home page content"
        file: "site/content/site-home.json"
        fields:
          - { name: eyebrow, label: "Eyebrow", widget: string }
          - { name: headline, label: "Headline", widget: string }
          - { name: subheadline, label: "Subheadline", widget: text }
          - { name: ctaPrimary, label: "Primary CTA text", widget: string }
          - { name: ctaSecondary, label: "Secondary CTA text", widget: string }
          - { name: ctaTertiary, label: "Tertiary CTA text", widget: string }
          - name: trustBadges
            label: "Trust badges"
            widget: list
            fields:
              - { name: value, label: "Value", widget: string }
              - { name: label, label: "Label", widget: string }
          - name: proofCards
            label: "Proof cards"
            widget: list
            fields:
              - { name: eyebrow, label: "Eyebrow", widget: string }
              - { name: title, label: "Title", widget: string }
              - { name: body, label: "Body", widget: text }
          - { name: processHeading, label: "Process heading", widget: string }
          - { name: processIntro, label: "Process intro", widget: text }
          - name: processSteps
            label: "Process steps"
            widget: list
            fields:
              - { name: number, label: "Number", widget: string }
              - { name: title, label: "Title", widget: string }
              - { name: body, label: "Body", widget: text }
          - { name: servicesHeading, label: "Services heading", widget: string }
          - { name: servicesIntro, label: "Services intro", widget: text }
          - name: serviceCards
            label: "Service cards"
            widget: list
            fields:
              - { name: title, label: "Title", widget: string }
              - { name: image, label: "Image", widget: image }
              - { name: alt, label: "Image alt text", widget: string }
              - { name: body, label: "Body", widget: text }
          - { name: whyChooseHeading, label: "Why choose heading", widget: string }
          - { name: whyChooseBody, label: "Why choose body", widget: text }
          - { name: whyChooseBadges, label: "Why choose badges", widget: list, field: { name: item, label: "Badge", widget: string } }
          - { name: expectationsHeading, label: "Expectations heading", widget: string }
          - { name: expectations, label: "Expectations", widget: list, field: { name: item, label: "Expectation", widget: string } }
          - name: spotlight
            label: "Spotlight section"
            widget: object
            fields:
              - { name: image, label: "Image", widget: image }
              - { name: alt, label: "Image alt text", widget: string }
              - { name: title, label: "Title", widget: string }
              - { name: body, label: "Body", widget: text }
          - { name: reviewsHeading, label: "Reviews heading", widget: string }
          - { name: ctaBandHeading, label: "CTA heading", widget: string }
          - { name: ctaBandBody, label: "CTA body", widget: text }
          - { name: ctaBandPrimary, label: "Primary CTA label", widget: string }
          - { name: ctaBandSecondary, label: "Secondary CTA label", widget: string }
          - { name: contactHeading, label: "Contact heading", widget: string }
          - { name: contactBody, label: "Contact body", widget: text }
          - { name: trustedHeading, label: "Trusted heading", widget: string }
          - { name: trustedBody, label: "Trusted body", widget: text }
          - { name: trustedBadges, label: "Trusted badges", widget: list, field: { name: item, label: "Badge", widget: string } }
          - { name: credentialsLink, label: "Credentials link label", widget: string }
          - { name: giftHeading, label: "Gift certificate heading", widget: string }
          - { name: giftBody, label: "Gift certificate text", widget: text }
          - { name: giftNote, label: "Gift certificate small print", widget: string }
          - { name: giftCta, label: "Gift certificate button label", widget: string }

  - name: servicesPage
    label: "Services Page"
    files:
      - name: services
        label: "Services page content"
        file: "site/content/site-services.json"
        fields:
          - { name: eyebrow, label: "Eyebrow", widget: string }
          - { name: headline, label: "Headline", widget: string }
          - { name: intro, label: "Intro", widget: text }
          - { name: careHeading, label: "Care heading", widget: string }
          - { name: careBody, label: "Care body", widget: text }
          - { name: careBadges, label: "Care badges", widget: list, field: { name: item, label: "Badge", widget: string } }
          - { name: popularHeading, label: "Popular services heading", widget: string }
          - { name: popularItems, label: "Popular services", widget: list, field: { name: item, label: "Service", widget: string } }
          - name: serviceGroups
            label: "Service groups & prices"
            label_singular: "Service group"
            widget: list
            fields:
              - { name: title, label: "Group title", widget: string }
              - { name: description, label: "Group description", widget: text, required: false }
              - name: items
                label: "Services & prices"
                label_singular: "Service"
                widget: list
                summary: "{{fields.name}} — {{fields.price}}"
                fields:
                  - { name: name, label: "Service", widget: string, hint: "e.g. Hour massage" }
                  - { name: price, label: "Price", widget: string, hint: "e.g. $75.00" }
              - { name: benefitSummary, label: "Benefits summary", widget: text, required: false }
              - { name: benefitAnchor, label: "Benefits page section id", widget: string, required: false, hint: "Links to that section on the Benefits page, e.g. massage or detox. Leave blank for no link." }
          - { name: pricingHeading, label: "Pricing heading", widget: string }
          - { name: pricingBody, label: "Pricing body", widget: text }
          - { name: pricingNote, label: "Pricing note", widget: text }
          - { name: ctaHeading, label: "CTA heading", widget: string }
          - { name: ctaBody, label: "CTA body", widget: text }
          - { name: ctaLink, label: "CTA link label", widget: string }

  - name: aboutPage
    label: "About Page"
    files:
      - name: about
        label: "About page content"
        file: "site/content/site-about.json"
        fields:
          - { name: eyebrow, label: "Eyebrow", widget: string }
          - { name: headline, label: "Headline", widget: string }
          - { name: intro, label: "Intro", widget: string }
          - { name: image, label: "Hero image", widget: image }
          - { name: imageAlt, label: "Hero image alt text", widget: string }
          - { name: paragraphs, label: "Paragraphs", widget: list, field: { name: paragraph, label: "Paragraph", widget: text } }
          - { name: whyChooseHeading, label: "Why choose heading", widget: string }
          - { name: whyChooseItems, label: "Why choose items", widget: list, field: { name: item, label: "Item", widget: string } }
          - { name: specialtiesHeading, label: "Specialties heading", widget: string }
          - { name: specialtiesIntro, label: "Specialties intro", widget: string }
          - { name: specialties, label: "Specialties", widget: list, field: { name: item, label: "Specialty", widget: string } }
          - { name: ctaHeading, label: "CTA heading", widget: string }
          - { name: ctaBody, label: "CTA body", widget: string }
          - { name: ctaButton, label: "CTA button label", widget: string }

  - name: contactPage
    label: "Contact Page"
    files:
      - name: contact
        label: "Contact page content"
        file: "site/content/site-contact.json"
        fields:
          - { name: eyebrow, label: "Eyebrow", widget: string }
          - { name: headline, label: "Headline", widget: string }
          - { name: intro, label: "Intro", widget: text }
          - { name: bookHeading, label: "Book heading", widget: string }
          - { name: goodToKnowHeading, label: "Good to know heading", widget: string }
          - { name: goodToKnowItems, label: "Steps", widget: list, field: { name: item, label: "Step", widget: string } }
          - { name: faqLink, label: "FAQ button text", widget: string }

  - name: faqPage
    label: "FAQ Page"
    files:
      - name: faq
        label: "FAQ page content"
        file: "site/content/site-faq.json"
        fields:
          - { name: eyebrow, label: "Eyebrow", widget: string }
          - { name: headline, label: "Headline", widget: string }
          - { name: intro, label: "Intro", widget: text }
          - name: faqs
            label: "FAQs"
            widget: list
            fields:
              - { name: q, label: "Question", widget: string }
              - { name: a, label: "Answer", widget: text }
          - { name: policiesHeading, label: "Policies heading", widget: string }
          - { name: policiesIntro, label: "Policies intro", widget: text }
          - name: policies
            label: "Policy cards"
            widget: list
            fields:
              - { name: title, label: "Title", widget: string }
              - { name: body, label: "Body", widget: text }
          - { name: ctaHeading, label: "CTA heading", widget: string }
          - { name: ctaBody, label: "CTA body", widget: text }
          - { name: ctaLink, label: "CTA button text", widget: string }

  - name: schoolPage
    label: "School Page"
    files:
      - name: school
        label: "School page content"
        file: "site/content/site-school.json"
        fields:
          - { name: eyebrow, label: "Eyebrow", widget: string }
          - { name: headline, label: "Headline", widget: string }
          - { name: intro, label: "Intro", widget: text }
          - { name: cardHeading, label: "Card heading", widget: string }
          - { name: cardBody, label: "Card body", widget: text }
          - { name: cardBadges, label: "Card badges", widget: list, field: { name: item, label: "Badge", widget: string } }
          - { name: interestHeading, label: "Interest heading", widget: string }
          - { name: interestBody, label: "Interest body", widget: text }
          - { name: studentHeading, label: "Student heading", widget: string }
          - { name: studentIntro, label: "Student intro", widget: text }
          - { name: ctaPrimary, label: "Primary CTA label", widget: string }
          - { name: ctaSecondary, label: "Secondary CTA label", widget: string }

  - name: benefitsPage
    label: "Benefits Page"
    files:
      - name: benefits
        label: "Benefits page content"
        file: "site/content/site-benefits.json"
        fields:
          - { name: eyebrow, label: "Small text above headline", widget: string }
          - { name: headline, label: "Headline", widget: string }
          - { name: intro, label: "Intro", widget: text }
          - name: firstVisit
            label: "Your first visit"
            widget: object
            fields:
              - { name: heading, label: "Heading", widget: string }
              - { name: body, label: "Text", widget: text }
              - { name: items, label: "Checklist", widget: list, field: { name: item, label: "Item", widget: string } }
          - name: services
            label: "Services"
            label_singular: "Service"
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: id, label: "Section id", widget: string, hint: "Lower case, no spaces (e.g. massage). The Services page links here." }
              - { name: name, label: "Service name", widget: string }
              - { name: tagline, label: "Tagline", widget: string }
              - { name: description, label: "Description", widget: text }
              - { name: benefits, label: "Benefits", widget: list, field: { name: item, label: "Benefit", widget: string } }
              - { name: prepTip, label: "Preparation tip", widget: text, required: false }
              - { name: disclaimer, label: "Disclaimer", widget: text, required: false }
          - { name: ctaHeading, label: "Bottom heading", widget: string }
          - { name: ctaBody, label: "Bottom text", widget: text }
          - { name: ctaLink, label: "Bottom button label", widget: string }

  - name: credentialsPage
    label: "Credentials Page"
    files:
      - name: credentials
        label: "Credentials page content"
        file: "site/content/site-credentials.json"
        fields:
          - { name: eyebrow, label: "Small text above headline", widget: string }
          - { name: headline, label: "Headline", widget: string }
          - { name: intro, label: "Intro", widget: text }
          - name: items
            label: "Credential cards"
            label_singular: "Credential"
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: "Title", widget: string }
              - { name: body, label: "Text", widget: text, hint: "Type {license} to insert the license number from Business Info." }
          - { name: note, label: "Small print", widget: text }
          - { name: ctaHeading, label: "Bottom heading", widget: string }
          - { name: ctaBody, label: "Bottom text", widget: string }
          - { name: ctaLink, label: "Bottom button label", widget: string }
